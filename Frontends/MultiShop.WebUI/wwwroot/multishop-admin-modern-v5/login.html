<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Giriş Yap | MultiShop Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="ms-login">
  <section class="ms-login-visual">
    <a class="ms-brand" href="dashboard.html">
      <span class="ms-brand-badge">MS</span>
      <span class="ms-brand-copy"><strong>MultiShop</strong><span>Yönetim Paneli</span></span>
    </a>
    <div class="ms-login-copy">
      <span class="ms-kicker">MULTISHOP YÖNETİM</span>
      <h1>Mağazanı tek panelden yönet.</h1>
      <p>Ürünleri ve kategorileri hızlıca düzenlemek için mağazanla aynı görsel dili taşıyan sade bir yönetim paneli.</p>
    </div>
    <div></div>
  </section>
  <section class="ms-login-panel">
    <div class="ms-login-box">
      <span class="ms-kicker">YÖNETİM PANELİ</span>
      <h2>Tekrar hoş geldin</h2>
      <p>Devam etmek için yönetici hesabınla giriş yap.</p>
      <form class="ms-login-form">
        <div class="ms-field"><label>E-posta</label><input class="ms-input" type="email" placeholder="admin@multishop.com"></div>
        <div class="ms-field"><label>Şifre</label><input class="ms-input" type="password" placeholder="••••••••"></div>
        <label class="ms-remember"><input type="checkbox"> Beni hatırla</label>
        <a class="ms-primary" href="dashboard.html">Giriş Yap <i class="fa-solid fa-arrow-right"></i></a>
      </form>
    </div>
  </section>
</div>
  <script src="assets/js/admin.js"></script>
</body>
</html>
